# Canonical Mood and Valence-Arousal Quadrant Mapping
# Russel's Circumplex Model of Affect:
# Quadrant 1 (Q1) - Happy:   High Valence (V >= 0.5), High Arousal (A >= 0.5)
# Quadrant 2 (Q2) - Angry:   Low Valence (V < 0.5),  High Arousal (A >= 0.5)
# Quadrant 3 (Q3) - Sad:     Low Valence (V < 0.5),  Low Arousal (A < 0.5)
# Quadrant 4 (Q4) - Calm:    High Valence (V >= 0.5), Low Arousal (A < 0.5)

quadrants:
  happy:
    id: 0
    name: "happy"
    valence_range: [0.5, 1.0]
    arousal_range: [0.5, 1.0]
    description: "High valence, high arousal: joyful, energetic, party, celebratory"
  angry:
    id: 1
    name: "angry"
    valence_range: [0.0, 0.5]
    arousal_range: [0.5, 1.0]
    description: "Low valence, high arousal: aggressive, intense, tension, dark, rage"
  sad:
    id: 2
    name: "sad"
    valence_range: [0.0, 0.5]
    arousal_range: [0.0, 0.5]
    description: "Low valence, low arousal: melancholic, grieving, sorrow, depressed"
  calm:
    id: 3
    name: "calm"
    valence_range: [0.5, 1.0]
    arousal_range: [0.0, 0.5]
    description: "High valence, low arousal: relaxing, peaceful, serene, tranquil, gentle"

# Mapping from MTG-Jamendo mood/theme tags to quadrants
jamendo_tag_map:
  # Q1: Happy
  "mood/theme---happy": "happy"
  "mood/theme---party": "happy"
  "mood/theme---fun": "happy"
  "mood/theme---positive": "happy"
  "mood/theme---upbeat": "happy"
  "mood/theme---celebration": "happy"
  "mood/theme---optimistic": "happy"
  "mood/theme---summer": "happy"
  "mood/theme---energetic": "happy"
  "mood/theme---uplifting": "happy"
  "mood/theme---action": "happy"

  # Q2: Angry / Tense / Dark
  "mood/theme---angry": "angry"
  "mood/theme---dark": "angry"
  "mood/theme---heavy": "angry"
  "mood/theme---aggressive": "angry"
  "mood/theme---drama": "angry"
  "mood/theme---action/drama": "angry"
  "mood/theme---scary": "angry"
  "mood/theme---horror": "angry"
  "mood/theme---war": "angry"

  # Q3: Sad / Melancholic
  "mood/theme---sad": "sad"
  "mood/theme---melancholic": "sad"
  "mood/theme---sorrow": "sad"
  "mood/theme---lonely": "sad"
  "mood/theme---depressing": "sad"
