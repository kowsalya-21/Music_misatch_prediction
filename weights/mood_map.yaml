# Ambiguous Jamendo tags explicitly excluded from mood classification
excluded_ambiguous_tags:
  - "mood/theme---film"            # Contextual usage, not an intrinsic emotion
  - "mood/theme---documentary"     # Media format
  - "mood/theme---background"      # Functional category
  - "mood/theme---soundtrack"      # Media format
  - "mood/theme---space"           # Thematic setting, indeterminate emotional valence
  - "mood/theme---advertising"     # Functional purpose
  - "mood/theme---commercial"      # Functional purpose
  - "mood/theme---corporate"       # Setting
  - "mood/theme---game"            # Contextual
  - "mood/theme---trailer"         # Format
  - "mood/theme---sport"           # Activity
  - "mood/theme---travel"          # Activity
  - "mood/theme---children"        # Demographic target, not a clear VA quadrant
  - "mood/theme---retro"           # Temporal style
  - "mood/theme---holiday"         # Contextual
  - "mood/theme---christmas"       # Contextual

