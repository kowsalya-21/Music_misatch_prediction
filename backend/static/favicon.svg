<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" fill="#F5F2EA"/>
  <!-- Analytical crosshair measurement grid -->
  <line x1="3" y1="16" x2="29" y2="16" stroke="#171717" stroke-width="1.25" stroke-linecap="square"/>
  <line x1="16" y1="3" x2="16" y2="29" stroke="#171717" stroke-width="1.25" stroke-linecap="square"/>
  <!-- Sub-ticks for measurement precision -->
  <line x1="16" y1="9.5" x2="18.5" y2="9.5" stroke="#171717" stroke-width="1" stroke-linecap="square"/>
  <line x1="16" y1="22.5" x2="18.5" y2="22.5" stroke="#171717" stroke-width="1" stroke-linecap="square"/>
  <line x1="9.5" y1="16" x2="9.5" y2="18.5" stroke="#171717" stroke-width="1" stroke-linecap="square"/>
  <line x1="22.5" y1="16" x2="22.5" y2="18.5" stroke="#171717" stroke-width="1" stroke-linecap="square"/>
  <!-- Signal node in Quadrant 1 (Valence / Arousal sample point) -->
  <circle cx="22.5" cy="9.5" r="3.25" fill="#D94820"/>
  <circle cx="22.5" cy="9.5" r="1.25" fill="#F5F2EA"/>
</svg>